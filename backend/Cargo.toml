[package]
name = "go-support-backend"
description = "The Go Support plugin's backend: the previews its settings regions draw, and the Go module directories it marks."
# Kept equal to the plugin's version; scripts/package.mjs refuses a mismatch.
version = "1.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.87"
publish = false

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
# The Rust plugin SDK has no release tag yet. This is the head of
# Lithe-core-rust#215, which adds workspace/setDirectoryMarks to the SDK; it
# moves to the Lithe-core-rust main commit once that pull request lands.
lithe-plugin-sdk = { git = "https://github.com/Lithe-IDEA/Lithe-core-rust", rev = "914fed28dd0f39f4e2f699214cadedb593d4057f" }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
